[package]
name = "pneutype-derive-tests"
version = "0.6.0"
authors = ["Victor Dods <victor.dods@gmail.com>"]
edition = "2021"

[dependencies]
pneutype = { path = "../pneutype", features = ["rustfmt"] }
serde = { version = "1", features = ["derive"] }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

[dev-dependencies]
serde_json = "1"
url = "2"
